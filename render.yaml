services:
  - type: web
    name: awp-analytics
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'python source_sync.py & exec gunicorn --workers 2 --threads 4 --timeout 300 app:app'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 500
      - key: GITHUB_TOKEN
        sync: false
      - key: AWP_SOURCE_REPO
        value: wincklers85/CalcolatoreAWP
      - key: AWP_SOURCE_BRANCH
        value: main
      - key: AWP_SOURCE_FOLDER
        value: Dati
      - key: AWP_SYNC_INTERVAL_SECONDS
        value: 1800
    disk:
      name: awp-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
